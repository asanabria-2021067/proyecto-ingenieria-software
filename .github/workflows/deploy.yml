name: Deploy to Azure VM

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

# G02 (OWASP25-C044): permisos minimos por defecto; solo los jobs que publican
# imagenes en GHCR suben a `packages: write` en su propio bloque.
permissions:
  contents: read

# Un deploy productivo a la vez; uno nuevo espera en cola y nunca cancela un
# release que ya esta en curso (migraciones a medias, contenedores recreados).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Ejecuta la suite completa de pruebas antes de construir y desplegar.
  # Reutiliza el workflow ci.yml, el mismo que corre en cada pull request.
  test:
    name: Pruebas antes de desplegar
    # G02 (N-03/T23): ningun job de este workflow corre fuera de main.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build-frontend:
    name: Build y push imagen frontend
    # G02 (N-03/T23): ningun job de este workflow corre fuera de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name=$(basename "${GITHUB_REPOSITORY,,}")
          echo "frontend_image=ghcr.io/${owner}/${repo_name}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.frontend_image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_APP_URL || 'http://158.23.57.118:3001' }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  build-backend:
    name: Build y push imagen backend
    # G02 (N-03/T23): ningun job de este workflow corre fuera de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name=$(basename "${GITHUB_REPOSITORY,,}")
          echo "backend_image=ghcr.io/${owner}/${repo_name}-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: |
            ${{ steps.vars.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Desplegar en la VM
    # G02 (N-03/T23): ningun job de este workflow corre fuera de main.
    if: github.ref == 'refs/heads/main'
    needs: [test, build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare image names
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name=$(basename "${GITHUB_REPOSITORY,,}")
          echo "frontend_image=ghcr.io/${owner}/${repo_name}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${owner}/${repo_name}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # G01 (FASE2-N01 + VM0-F012): el .env de produccion se arma en el runner a
      # partir de variables de entorno del paso (nunca interpoladas en el texto
      # de un comando) y viaja a la VM por stdin de SSH. El comando remoto es
      # estatico, asi que ningun secreto queda en el argv ni en /proc de la VM.
      #
      # Contrato de configuracion (G01-C08, OWASP25-C030 + VM0-F019): cada
      # variable escrita aqui tiene un consumidor registrado en
      # apps/backend/test/helpers/deploy-env-registry.ts. Un flag nuevo se
      # declara SIEMPRE como `NOMBRE: ${{ vars.NOMBRE || '<default>' }}`, con un
      # default que reproduce el comportamiento actual, de modo que el deploy
      # funciona con cero GitHub Variables creadas.
      - name: Transferir .env de produccion por stdin
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.PUBLIC_APP_URL || 'http://158.23.57.118:3001' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_IMAGE: ${{ steps.vars.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.vars.outputs.frontend_image }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/deploy-env"
          mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$work/key"
          {
            printf 'NODE_ENV=production\n'
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_NAME=uvg_collab\n'
            printf 'DB_PORT=5432\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_REFRESH_SECRET=%s\n' "$JWT_REFRESH_SECRET"
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL"
            printf 'NEXT_PUBLIC_API_PREFIX=/api\n'
            printf 'NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=%s\n' "$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME"
            printf 'NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=%s\n' "$NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET"
            printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
          } > "$work/env"
          ssh -i "$work/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$work/known_hosts" "$SERVER_USER@$SERVER_IP" \
            'umask 077 && mkdir -p ~/.uvg-deploy && chmod 700 ~/.uvg-deploy && cat > ~/.uvg-deploy/env.incoming' \
            < "$work/env"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e

            cd ~/proyecto-ingenieria-software

            git checkout main
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --include-untracked -m "auto-deploy-$(date +%Y%m%d-%H%M%S)" || true
            fi
            git fetch --depth=1 --prune origin main
            git reset --hard FETCH_HEAD
            AUTO_STASHES=$(git stash list | grep "auto-deploy-" | tail -n +6 | cut -d: -f1 || true)
            if [ -n "$AUTO_STASHES" ]; then
              echo "$AUTO_STASHES" | while read -r STASH_REF; do
                [ -n "$STASH_REF" ] && git stash drop "$STASH_REF" || true
              done
            fi

            # G01: el .env llego por stdin en el paso anterior (fuera del argv);
            # se instala con permisos 0600 y el temporal se elimina.
            test -s ~/.uvg-deploy/env.incoming
            install -m 600 ~/.uvg-deploy/env.incoming .env
            rm -f ~/.uvg-deploy/env.incoming

            # Solo backend/frontend viven en GHCR y cambian en cada deploy.
            # postgres/redis son imagenes fijas que ya estan en la VM: pedirlas
            # de nuevo en cada deploy las manda a Docker Hub sin necesidad, y
            # un Docker Hub caido (TLS handshake timeout) alargaba el fallo.
            n=0
            until docker compose pull backend frontend; do
              n=$((n+1))
              if [ "$n" -ge 2 ]; then
                echo "Fallo de red: no se pudo descargar backend/frontend desde GHCR tras $n intentos"
                exit 1
              fi
              echo "Pull failed (attempt $n/2), retrying in 15s..."
              sleep 15
            done

            # --no-deps: no toca postgres/redis (evita un reinicio innecesario
            # de la base de datos en cada deploy). --no-build: si alguna vez
            # Compose intentara construir en la VM (2GB RAM, inviable para
            # Next.js), esto falla explicito en vez de intentarlo.
            docker compose --profile app up -d --no-deps --no-build --remove-orphans backend frontend

            echo "Waiting for backend to be healthy..."
            BACKEND_READY=0
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 http://127.0.0.1:3001/api >/dev/null; then
                echo "Backend is healthy."
                BACKEND_READY=1
                break
              fi
              sleep 3
            done
            if [ "$BACKEND_READY" -ne 1 ]; then
              echo "Fallo de arranque: el backend no respondio a tiempo (la imagen ya se descargo, no es un problema de red)"
              docker compose --profile app ps
              docker compose logs --tail=120 backend || true
              exit 1
            fi

            docker compose --profile app ps
            docker image prune -f --filter "until=168h"
