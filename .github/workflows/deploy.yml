name: Deploy to Azure VM

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

jobs:
  # Ejecuta la suite completa de pruebas antes de construir y desplegar.
  # Reutiliza el workflow ci.yml, el mismo que corre en cada pull request.
  test:
    name: Pruebas antes de desplegar
    uses: ./.github/workflows/ci.yml

  build-frontend:
    name: Build y push imagen frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name=$(basename "${GITHUB_REPOSITORY,,}")
          echo "frontend_image=ghcr.io/${owner}/${repo_name}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.frontend_image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_APP_URL || 'http://158.23.57.118:3001' }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  build-backend:
    name: Build y push imagen backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name=$(basename "${GITHUB_REPOSITORY,,}")
          echo "backend_image=ghcr.io/${owner}/${repo_name}-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: |
            ${{ steps.vars.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Desplegar en la VM
    needs: [test, build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare image names
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name=$(basename "${GITHUB_REPOSITORY,,}")
          echo "frontend_image=ghcr.io/${owner}/${repo_name}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${owner}/${repo_name}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e

            cd ~/proyecto-ingenieria-software

            git checkout main
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --include-untracked -m "auto-deploy-$(date +%Y%m%d-%H%M%S)" || true
            fi
            git fetch --depth=1 --prune origin main
            git reset --hard FETCH_HEAD
            AUTO_STASHES=$(git stash list | grep "auto-deploy-" | tail -n +6 | cut -d: -f1 || true)
            if [ -n "$AUTO_STASHES" ]; then
              echo "$AUTO_STASHES" | while read -r STASH_REF; do
                [ -n "$STASH_REF" ] && git stash drop "$STASH_REF" || true
              done
            fi

            cat > .env <<'ENVEOF'
            NODE_ENV=production
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=uvg_collab
            DB_PORT=5432
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_APP_URL || 'http://158.23.57.118:3001' }}
            NEXT_PUBLIC_API_PREFIX=/api
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            BACKEND_IMAGE=${{ steps.vars.outputs.backend_image }}
            FRONTEND_IMAGE=${{ steps.vars.outputs.frontend_image }}
            ENVEOF

            # Solo backend/frontend viven en GHCR y cambian en cada deploy.
            # postgres/redis son imagenes fijas que ya estan en la VM: pedirlas
            # de nuevo en cada deploy las manda a Docker Hub sin necesidad, y
            # un Docker Hub caido (TLS handshake timeout) alargaba el fallo.
            n=0
            until docker compose pull backend frontend; do
              n=$((n+1))
              if [ "$n" -ge 2 ]; then
                echo "Fallo de red: no se pudo descargar backend/frontend desde GHCR tras $n intentos"
                exit 1
              fi
              echo "Pull failed (attempt $n/2), retrying in 15s..."
              sleep 15
            done

            # --no-deps: no toca postgres/redis (evita un reinicio innecesario
            # de la base de datos en cada deploy). --no-build: si alguna vez
            # Compose intentara construir en la VM (2GB RAM, inviable para
            # Next.js), esto falla explicito en vez de intentarlo.
            docker compose --profile app up -d --no-deps --no-build --remove-orphans backend frontend

            echo "Waiting for backend to be healthy..."
            BACKEND_READY=0
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 http://127.0.0.1:3001/api >/dev/null; then
                echo "Backend is healthy."
                BACKEND_READY=1
                break
              fi
              sleep 3
            done
            if [ "$BACKEND_READY" -ne 1 ]; then
              echo "Fallo de arranque: el backend no respondio a tiempo (la imagen ya se descargo, no es un problema de red)"
              docker compose --profile app ps
              docker compose logs --tail=120 backend || true
              exit 1
            fi

            docker compose --profile app ps
            docker image prune -f --filter "until=168h"
