name: k6 - pruebas de carga

# T-200: engancha k6/ a CI. Decision (documentada en el PR de T-200): NO corre
# en cada PR -- las pruebas de carga van contra el entorno ya desplegado (VM
# de 842 MiB compartida, rate limiter en ThrottlerModule de 10 req/1s de
# ráfaga pero 5 req/s sostenido -- 50 req/10s en el tier "medium", ver
# apps/backend/src/app.module.ts -- así que escalar K6_VUS/K6_ITERATIONS por
# encima de eso dispara 429s, no una regresión real), y un PR abierto no
# tiene ese entorno disponible ni se le puede pedir que tolere carga real.
# Corre sola: workflow_dispatch (bajo demanda) + un cron semanal, nunca
# bloquea un PR.
#
# schedule y workflow_dispatch solo se activan cuando este archivo vive en
# la rama por defecto del repo (hoy `main`, ver `gh repo view`): mientras
# este workflow solo exista en `develop`, ninguno de los dos dispara nada.
#
# El fixture de k6 (prisma/seed-k6-fixture.ts, namespace k6.*) escribe via
# Prisma directo a Postgres, y Postgres de la VM solo escucha en
# 127.0.0.1 (ver apps/backend/docker-compose.yml) -- no es alcanzable desde
# un runner de GitHub. Se abre un tunel SSH (mismas credenciales que ya usa
# deploy.yml: SERVER_IP/SERVER_USER/SSH_PRIVATE_KEY) que reenvia el puerto
# de Postgres al runner; el trafico HTTP de k6 en cambio va directo a la URL
# publica del backend, para medir la ruta real (rate limiter incluido).
on:
  workflow_dispatch:
  schedule:
    # Lunes 06:00 UTC (00:00 Guatemala). Ajustable si el equipo prefiere otra
    # ventana; el objetivo es "una vez por semana", no un horario exacto.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: k6-load
  cancel-in-progress: false

jobs:
  k6:
    name: Escenarios k6 contra el entorno desplegado
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/backend
    env:
      K6_BASE_URL: ${{ secrets.PUBLIC_APP_URL || 'https://158.23.57.118.nip.io' }}
      K6_FIXTURE_PASSWORD: ${{ secrets.K6_FIXTURE_PASSWORD }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Instalar k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Abrir tunel SSH hacia Postgres de la VM (127.0.0.1:5432 -> runner:5432)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS" || { echo "falta SSH_KNOWN_HOSTS" >&2; exit 1; }
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            -fNT -L 5432:127.0.0.1:5432 \
            "$SERVER_USER@$SERVER_IP"

      # Los tres pasos de k6 corren prisma/seed-k6-fixture.ts antes de cada
      # `k6 run` (ver apps/backend/scripts/run-k6.js): ese fixture siempre
      # escribe (upsert de usuarios, reset del Sprint #1 a ACTIVO), incluso
      # antes del escenario de solo-lectura. Y GET /proyectos no tiene guard
      # (k6/scenarios/project-listing.js), así que el proyecto fixture queda
      # visible en el listado público de la app desplegada, no aislado.
      - name: Listado de proyectos (HTTP solo GET; el fixture previo sí escribe)
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/uvg_collab?schema=public
          DIRECT_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/uvg_collab?schema=public
        run: npm run k6:project-listing

      - name: Operaciones de kanban (escribe en el proyecto k6.*)
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/uvg_collab?schema=public
          DIRECT_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/uvg_collab?schema=public
        run: npm run k6:kanban

      - name: Conexion Socket.IO
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/uvg_collab?schema=public
          DIRECT_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/uvg_collab?schema=public
        run: npm run k6:socket-io
