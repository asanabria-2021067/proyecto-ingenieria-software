name: CI

# Se ejecuta en tres escenarios:
#   1. pull_request  -> valida cada PR hacia main o develop
#   2. push          -> valida cada push directo a develop
#   3. workflow_call -> lo invoca deploy.yml antes de desplegar a produccion
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  # G02 (OWASP25-C033 + FASE2-N06): quien reutiliza este workflow decide de
  # forma explicita si corre el E2E. Dentro de un workflow_call,
  # github.event_name es el evento del CALLER (p. ej. `push` a main), asi que
  # no sirve para decidirlo.
  workflow_call:
    inputs:
      e2e:
        description: "'run' ejecuta la suite E2E; 'skip' la omite"
        type: string
        required: true
  workflow_dispatch:

# Si se empujan varios commits seguidos al mismo PR, cancela las corridas
# anteriores y deja solo la ultima.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# G02 (OWASP25-C044): el token de CI solo lee el repositorio. Ningun job de CI
# publica ni despliega, asi que ninguno necesita permisos de escritura.
permissions:
  contents: read

env:
  # Prisma exige que la variable exista para generar el cliente.
  # Apunta al servicio postgres efimero del job backend (ver abajo).
  # Las pruebas unitarias siguen usando mocks (nunca tocan esta base); las
  # de integracion si se conectan realmente via INTEGRATION_DATABASE_URL.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  # AuthService falla al arrancar sin esto (ver auth.service.ts) - no tiene
  # valor por defecto a proposito, asi que CI debe proveerlo explicitamente.
  JWT_REFRESH_SECRET: ci-refresh-secret
  # G01 (OWASP25-C019): secreto JWT SINTETICO de >=32 caracteres para todo job
  # que arranque Nest; CI no debe depender del fallback predecible del codigo.
  # No es un secreto real: solo firma tokens efimeros dentro del runner.
  JWT_SECRET: ci-synthetic-jwt-secret-not-for-production-0000

jobs:
  # G03 (OWASP25-C041): en todo PR se revisan SOLO las dependencias que el PR
  # agrega o cambia (diff base..head del dependency graph) y se bloquea si
  # alguna trae una vulnerabilidad high o critical. El backlog historico no se
  # evalua aqui (lo reporta el audit informativo). Solo lectura del repo.
  dependency-review:
    name: Revision de dependencias del PR
    if: github.event_name == 'pull_request' && !inputs.e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Revisar dependencias nuevas o cambiadas
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # G03 (OWASP25-C040): resumen INFORMATIVO del backlog de `npm audit
  # --omit=dev` por app, desde el lockfile y sin instalar nada. El script solo
  # publica conteos, paquetes e IDs GHSA saneados y siempre termina en 0; sin
  # secretos ni credenciales de registry. No corre en el workflow_call del deploy.
  dependency-audit:
    name: Audit de dependencias (informativo)
    if: ${{ !inputs.e2e }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resumen de npm audit (produccion)
        run: node .github/scripts/npm-audit-summary.mjs apps/backend apps/frontend

  # G08 (OWASP25-C048 · A08:2025): el PR de la rama OWASP hacia develop solo
  # puede traer el delta de la workstream (rutas de la allowlist, commits
  # trazables). Base = merge-base con develop; solo Git local y lectura del
  # repo: sin secretos, sin deploy, sin imagenes y sin ninguna ruta hacia main.
  owasp-delta:
    name: OWASP_DELTA_ISOLATED
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref == 'sprint8/vernel-owasp2025' && !inputs.e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar el delta OWASP aislado
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/security/verify-owasp-delta.mjs --base-ref "$BASE_REF"

  backend:
    name: Backend - lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones Prisma
        run: npx prisma migrate deploy

      # test/s7-bootstrap.spec.ts audita dist/ (el artefacto real desplegado,
      # ver ese archivo) y falla si no existe: sin este build, ese spec
      # rompe cada corrida de este job aunque el resto del codigo este bien.
      - name: Compilar (nest build)
        run: npm run build

      # G02 (OWASP25-C031): un error de lint hace fallar el job; nada lo
      # convierte en exito.
      - name: Lint
        run: npm run lint

      # Cobertura completa solo en PR (gate antes de mergear); en push/deploy
      # (workflow_call) corren las pruebas sin instrumentar cobertura para
      # que el pipeline de deploy sea rapido — la validacion fuerte ya paso
      # en el PR que se mergeo.
      - name: Pruebas unitarias con cobertura (Vitest)
        if: github.event_name == 'pull_request'
        run: npm run test:coverage

      - name: Pruebas unitarias (Vitest, sin cobertura)
        if: github.event_name != 'pull_request'
        run: npm run test

      # G02 (OWASP25-C034): las suites que exigen PostgreSQL real no se saltan en
      # CI. Cada interruptor apunta SOLO al servicio efimero de este job; nunca a
      # una base compartida ni productiva.
      - name: Pruebas de integracion en serie contra Postgres efimero (Vitest)
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          ROLES_IT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          RUN_REAL_DB_TESTS: '1'

  frontend:
    name: Frontend - lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # G02 (OWASP25-C031): un error de lint hace fallar el job; nada lo
      # convierte en exito.
      - name: Lint
        run: npm run lint

      # G02 (OWASP25-C043): errores de TypeScript (incluidos los tests) fallan
      # en todo evento; no dependen de lo que `next build` decida comprobar.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # FASE-CI01: cache del compilador incremental de Next (no del resultado
      # final: `next build` sigue corriendo siempre). Clave por lockfile +
      # fuentes; si ninguno cambio, Next reutiliza el analisis previo.
      - name: Cache de build de Next.js
        uses: actions/cache@v4
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.[jt]s', 'apps/frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-

      # G02 (OWASP25-C043): build de produccion de Next en todo evento (PR,
      # push, dispatch y workflow_call del deploy), con configuracion publica
      # SINTETICA: nunca secretos ni la URL real de produccion.
      - name: Build de produccion (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_API_PREFIX: /api

      # La cobertura es un gate obligatorio en Pull Requests.
      # Los umbrales se definen en apps/frontend/vitest.config.ts.
      # Si la cobertura cae por debajo del mínimo acordado, Vitest
      # termina con error y este job impide integrar el PR.
      - name: Pruebas unitarias con cobertura (Vitest)
        if: github.event_name == 'pull_request'
        run: npm run test:coverage

      # G02 (OWASP25-C032): fuera de PR (push, dispatch y el workflow_call del
      # deploy) las pruebas corren igual, sin instrumentar cobertura, como en
      # el job backend: un deploy de main no puede saltarse estos tests.
      - name: Pruebas unitarias (Vitest, sin cobertura)
        if: github.event_name != 'pull_request'
        run: npm run test

  # FASE-CI01: la suite de humo se reparte en 3 shards que corren en paralelo,
  # cada uno con su propio Postgres/Redis/backend/frontend efimeros (aislados
  # entre si: un shard nunca ve los datos de otro). El nombre de ESTE job
  # lleva el numero de shard porque GitHub le agrega el valor de la matriz al
  # nombre visible; el job `e2e` de abajo (sin matriz) es el que conserva el
  # nombre estable de siempre para no romper los checks requeridos.
  e2e-shard:
    name: E2E - shard ${{ matrix.shardIndex }}/3 (Playwright)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
    # A diferencia de los jobs backend/frontend (que usan mocks), este job
    # necesita una base de datos y un Redis reales: arranca el backend de
    # verdad y navega la app de verdad con un navegador. Es lento (~10min+)
    # aun con cache, asi que NO corre en cada push/PR a develop.
    # - Reutilizado (workflow_call): decide SOLO el input `e2e` del caller
    #   (deploy.yml pide `run`).
    # - Invocado directamente (sin input): PR hacia main o workflow_dispatch.
    if: >-
      inputs.e2e == 'run' ||
      (!inputs.e2e && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')))
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: uvg_collab_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d uvg_collab_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/uvg_collab_e2e?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/uvg_collab_e2e?schema=public
      JWT_SECRET: e2e-ci-synthetic-jwt-secret-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_PRODUCTION_SERVER: '1'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: apps/backend
        run: npm ci

      # G02 (OWASP25-C033): el esquema se crea con las migraciones reales
      # (`migrate deploy`, lo mismo que corre produccion al arrancar), nunca con
      # `db push`, que ignora el historial de migraciones. Base efimera del job.
      - name: Preparar base de datos (migraciones + seed)
        working-directory: apps/backend
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Compilar y levantar el backend en segundo plano
        working-directory: apps/backend
        env:
          PORT: 3001
        run: |
          npm run build
          npm run start:prod &

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Instalar dependencias del frontend
        working-directory: apps/frontend
        run: npm ci

      # FASE-CI01: misma cache incremental de Next que el job `frontend`
      # (clave por lockfile + fuentes); `next build` sigue corriendo siempre.
      - name: Cache de build de Next.js
        uses: actions/cache@v4
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.[jt]s', 'apps/frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-

      # G02 (OWASP25-C033): el E2E navega el build de produccion (next build +
      # next start via playwright.config.ts), no el dev server.
      - name: Build de produccion del frontend para E2E
        working-directory: apps/frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Cache de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/frontend/package-lock.json') }}

      - name: Instalar navegador y dependencias de Playwright
        working-directory: apps/frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar solo dependencias del sistema de Playwright (navegador ya en cache)
        working-directory: apps/frontend
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # T-318: la comprobacion de accesibilidad con axe corre PRIMERO y en su
      # propio paso. Asi su resultado se ve por separado y un fallo de otro
      # flujo E2E no lo oculta. Falla el job si axe encuentra una violacion
      # `serious` o `critical` (WCAG 2.0/2.1 A y AA) en las cinco pantallas
      # auditadas, en claro y oscuro. Sin `continue-on-error`: es bloqueante.
      # FASE-CI01: corre una sola vez (shard 1) para no repetir trabajo en los
      # otros shards; sigue bloqueante y en el mismo orden. La suite de abajo
      # (sin estos dos specs, ya cubiertos aqui) se reparte entre los 3 shards.
      - name: Accesibilidad con axe (cinco pantallas, claro y oscuro)
        id: a11y
        if: matrix.shardIndex == 1
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-a11y
        run: npm run test:e2e:a11y

      # El reporte lleva, por pantalla y tema, el JSON de axe (regla, impacto,
      # criterio y selector; sin HTML de la pagina). Se sube pase o falle, para
      # que quede evidencia de que la comprobacion corrio.
      - name: Subir evidencia de accesibilidad (axe)
        if: always() && steps.a11y.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-axe-report
          path: apps/frontend/playwright-report-a11y/
          retention-days: 7
          if-no-files-found: warn

      # FASE-CI01: la suite completa (sin los dos specs de a11y, ya cubiertos
      # arriba) se reparte en 3 shards con --shard; cada shard corre los
      # mismos specs que antes, solo que un tercio a la vez. El reporte sale
      # en formato `blob` (binario, por shard) para combinarse despues en un
      # unico HTML en el job `e2e` (abajo).
      - name: Ejecutar suite de humo E2E
        working-directory: apps/frontend
        run: npm run test:e2e:sin-a11y -- --reporter=blob --shard=${{ matrix.shardIndex }}/3

      - name: Subir el reporte blob de este shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/frontend/blob-report/
          retention-days: 7

  # FASE-CI01: job SIN matriz que conserva el nombre estable de siempre (los
  # checks requeridos de la rama apuntan a ese nombre; un job con `matrix`
  # aparece en GitHub con el valor de la matriz pegado al nombre, por eso el
  # merge vive aparte). Corre siempre que `e2e-shard` no haya quedado
  # `skipped` (si no debia correr, este tampoco) y falla si algun shard
  # fallo, aunque el merge de reportes en si haya salido bien.
  e2e:
    name: E2E - suite de humo (Playwright)
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always() && needs.e2e-shard.result != 'skipped'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: apps/frontend
        run: npm ci

      - name: Descargar los reportes blob de los 3 shards
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: apps/frontend/all-blob-reports
          merge-multiple: true

      - name: Combinar los reportes en un unico HTML
        working-directory: apps/frontend
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Subir el reporte combinado de Playwright (solo si algun shard fallo)
        if: needs.e2e-shard.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - name: Fallar si algun shard fallo
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "Al menos un shard de la suite de humo E2E termino en '${{ needs.e2e-shard.result }}'." >&2
          exit 1

  # G02 (D4 + OWASP25-C043/C044): arnes efimero de topologia (nginx versionado,
  # TLS autofirmado, imagenes de los Dockerfiles productivos, PostgreSQL 17 y
  # Redis 7) dentro del runner. Siempre en PR hacia main; en PR hacia develop
  # solo si el PR toca realtime, nginx, cabeceras, topologia o el arnes
  # (infra/staging/should-run.mjs); a mano con workflow_dispatch. Nunca dentro
  # del workflow_call del deploy (el input `e2e` solo existe en esa llamada).
  # Sin secretos, sin publicacion ni deploy: alcance a produccion NONE.
  topology:
    name: Topologia - arnes efimero (nginx + TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      !inputs.e2e &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          # Merge commit del PR y su primer padre (punta de la base) para el filtro de rutas.
          fetch-depth: 2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decidir si el arnes aplica a este cambio
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node infra/staging/should-run.mjs >> "$GITHUB_OUTPUT"

      - name: Guard de representatividad (infra/staging vs infra/nginx)
        if: steps.scope.outputs.run == 'true'
        run: node infra/staging/check-representativity.mjs

      - name: Arnes efimero - build, caracterizacion y destruccion
        if: steps.scope.outputs.run == 'true'
        run: infra/staging/run-harness.sh
