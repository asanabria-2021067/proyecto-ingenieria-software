name: CI

# Se ejecuta en tres escenarios:
#   1. pull_request  -> valida cada PR hacia main o develop
#   2. push          -> valida cada push directo a develop
#   3. workflow_call -> lo invoca deploy.yml antes de desplegar a produccion
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  # G02: dentro de un workflow_call, github.event_name es el evento del
  # CALLER (p. ej. `push` a main), asi que no sirve para distinguir "esto es
  # el workflow_call del deploy" de una invocacion directa. Este input solo
  # existe para esa deteccion (lo usan dependency-review, dependency-audit,
  # owasp-delta y topology); deploy.yml siempre manda un valor no vacio.
  workflow_call:
    inputs:
      e2e:
        type: string
        required: true
  workflow_dispatch:

# Si se empujan varios commits seguidos al mismo PR, cancela las corridas
# anteriores y deja solo la ultima.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# G02 (OWASP25-C044): el token de CI solo lee el repositorio. Ningun job de CI
# publica ni despliega, asi que ninguno necesita permisos de escritura.
permissions:
  contents: read

env:
  # Prisma exige que la variable exista para generar el cliente.
  # Apunta al servicio postgres efimero del job backend (ver abajo).
  # Las pruebas unitarias siguen usando mocks (nunca tocan esta base); las
  # de integracion si se conectan realmente via INTEGRATION_DATABASE_URL.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  # AuthService falla al arrancar sin esto (ver auth.service.ts) - no tiene
  # valor por defecto a proposito, asi que CI debe proveerlo explicitamente.
  JWT_REFRESH_SECRET: ci-refresh-secret
  # G01 (OWASP25-C019): secreto JWT SINTETICO de >=32 caracteres para todo job
  # que arranque Nest; CI no debe depender del fallback predecible del codigo.
  # No es un secreto real: solo firma tokens efimeros dentro del runner.
  JWT_SECRET: ci-synthetic-jwt-secret-not-for-production-0000

jobs:
  # G03 (OWASP25-C041): en todo PR se revisan SOLO las dependencias que el PR
  # agrega o cambia (diff base..head del dependency graph) y se bloquea si
  # alguna trae una vulnerabilidad high o critical. El backlog historico no se
  # evalua aqui (lo reporta el audit informativo). Solo lectura del repo.
  dependency-review:
    name: Revision de dependencias del PR
    if: github.event_name == 'pull_request' && !inputs.e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Revisar dependencias nuevas o cambiadas
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # G03 (OWASP25-C040): resumen INFORMATIVO del backlog de `npm audit
  # --omit=dev` por app, desde el lockfile y sin instalar nada. El script solo
  # publica conteos, paquetes e IDs GHSA saneados y siempre termina en 0; sin
  # secretos ni credenciales de registry. No corre en el workflow_call del deploy.
  dependency-audit:
    name: Audit de dependencias (informativo)
    if: ${{ !inputs.e2e }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Resumen de npm audit (produccion)
        run: node .github/scripts/npm-audit-summary.mjs apps/backend apps/frontend

  # G08 (OWASP25-C048 · A08:2025): el PR de la rama OWASP hacia develop solo
  # puede traer el delta de la workstream (rutas de la allowlist, commits
  # trazables). Base = merge-base con develop; solo Git local y lectura del
  # repo: sin secretos, sin deploy, sin imagenes y sin ninguna ruta hacia main.
  owasp-delta:
    name: OWASP_DELTA_ISOLATED
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref == 'sprint8/vernel-owasp2025' && !inputs.e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verificar el delta OWASP aislado
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/security/verify-owasp-delta.mjs --base-ref "$BASE_REF"

  backend:
    name: Backend - lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones Prisma
        run: npx prisma migrate deploy

      # test/s7-bootstrap.spec.ts audita dist/ (el artefacto real desplegado,
      # ver ese archivo) y falla si no existe: sin este build, ese spec
      # rompe cada corrida de este job aunque el resto del codigo este bien.
      - name: Compilar (nest build)
        run: npm run build

      # G02 (OWASP25-C031): un error de lint hace fallar el job; nada lo
      # convierte en exito.
      - name: Lint
        run: npm run lint

      # RTF-3.1: un *.service.ts nuevo exige su *.service.spec.ts; los
      # existentes sin spec viven en scripts/service-spec-exceptions.txt.
      - name: Guard de specs de servicios
        working-directory: .
        run: node scripts/check-service-specs.mjs

      # Cobertura completa solo en PR (gate antes de mergear); en push/deploy
      # (workflow_call) corren las pruebas sin instrumentar cobertura para
      # que el pipeline de deploy sea rapido — la validacion fuerte ya paso
      # en el PR que se mergeo.
      - name: Pruebas unitarias con cobertura (Vitest)
        if: github.event_name == 'pull_request'
        run: npm run test:coverage

      - name: Pruebas unitarias (Vitest, sin cobertura)
        if: github.event_name != 'pull_request'
        run: npm run test

      # G02 (OWASP25-C034): las suites que exigen PostgreSQL real no se saltan en
      # CI. Cada interruptor apunta SOLO al servicio efimero de este job; nunca a
      # una base compartida ni productiva.
      - name: Pruebas de integracion en serie contra Postgres efimero (Vitest)
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          ROLES_IT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          RUN_REAL_DB_TESTS: '1'

  frontend:
    name: Frontend - lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # G02 (OWASP25-C031): un error de lint hace fallar el job; nada lo
      # convierte en exito.
      - name: Lint
        run: npm run lint

      # G02 (OWASP25-C043): errores de TypeScript (incluidos los tests) fallan
      # en todo evento; no dependen de lo que `next build` decida comprobar.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # FASE-CI01: cache del compilador incremental de Next (no del resultado
      # final: `next build` sigue corriendo siempre). Clave por lockfile +
      # fuentes; si ninguno cambio, Next reutiliza el analisis previo.
      - name: Cache de build de Next.js
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/**/*.[jt]s', 'apps/frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}-

      # G02 (OWASP25-C043): build de produccion de Next en todo evento (PR,
      # push, dispatch y workflow_call del deploy), con configuracion publica
      # SINTETICA: nunca secretos ni la URL real de produccion.
      - name: Build de produccion (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_API_PREFIX: /api

      # La cobertura es un gate obligatorio en Pull Requests.
      # Los umbrales se definen en apps/frontend/vitest.config.ts.
      # Si la cobertura cae por debajo del mínimo acordado, Vitest
      # termina con error y este job impide integrar el PR.
      - name: Pruebas unitarias con cobertura (Vitest)
        if: github.event_name == 'pull_request'
        run: npm run test:coverage

      # G02 (OWASP25-C032): fuera de PR (push, dispatch y el workflow_call del
      # deploy) las pruebas corren igual, sin instrumentar cobertura, como en
      # el job backend: un deploy de main no puede saltarse estos tests.
      - name: Pruebas unitarias (Vitest, sin cobertura)
        if: github.event_name != 'pull_request'
        run: npm run test

  # G02 (D4 + OWASP25-C043/C044): arnes efimero de topologia (nginx versionado,
  # TLS autofirmado, imagenes de los Dockerfiles productivos, PostgreSQL 17 y
  # Redis 7) dentro del runner. Siempre en PR hacia main; en PR hacia develop
  # solo si el PR toca realtime, nginx, cabeceras, topologia o el arnes
  # (infra/staging/should-run.mjs); a mano con workflow_dispatch. Nunca dentro
  # del workflow_call del deploy (el input `e2e` solo existe en esa llamada).
  # Sin secretos, sin publicacion ni deploy: alcance a produccion NONE.
  topology:
    name: Topologia - arnes efimero (nginx + TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      !inputs.e2e &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Merge commit del PR y su primer padre (punta de la base) para el filtro de rutas.
          fetch-depth: 2

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Decidir si el arnes aplica a este cambio
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node infra/staging/should-run.mjs >> "$GITHUB_OUTPUT"

      - name: Guard de representatividad (infra/staging vs infra/nginx)
        if: steps.scope.outputs.run == 'true'
        run: node infra/staging/check-representativity.mjs

      - name: Arnes efimero - build, caracterizacion y destruccion
        if: steps.scope.outputs.run == 'true'
        run: infra/staging/run-harness.sh

  # HU-192 (T-355): escaneo de secretos sobre TODO el historial git con gitleaks
  # (reglas por defecto + allowlist de .gitleaks.toml). Los hallazgos ya conocidos
  # y redactados viven en .gitleaks-baseline.json; cualquier secreto nuevo falla
  # el job. El binario se descarga de la release oficial fijada y se verifica con
  # su sha256 antes de ejecutarlo. Solo lectura del repo.
  gitleaks:
    name: Escaneo de secretos (gitleaks)
    if: ${{ !inputs.e2e }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Instalar gitleaks verificado
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Escanear el historial completo
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git .
          --config .gitleaks.toml
          --baseline-path .gitleaks-baseline.json
          --redact --no-banner --verbose
