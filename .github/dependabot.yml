# G03 (OWASP25-C042): actualizaciones de dependencias controladas y SOLO por
# revision humana. Semanal, agrupadas (minor + patch en un PR por ecosistema),
# con limite de PRs abiertos y sin saltos major (esos se planifican a mano).
# Ningun workflow del repo auto-aprueba ni auto-mergea PRs de Dependabot.
# Los PRs apuntan a develop, la rama de integracion del equipo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
