include:
  - path: apps/backend/docker-compose.yml
    env_file: .env

services:
  redis:
    image: redis:7-alpine
    container_name: uvg-collab-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - uvg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/asanabria-2021067/proyecto-ingenieria-software-backend:latest}
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: uvg-collab-backend
    profiles:
      - app
    restart: unless-stopped
    # G04 (OWASP25-C021 + P5/T19): la interfaz publicada es configurable. El
    # default 0.0.0.0 conserva la exposicion actual; 127.0.0.1 deja el backend
    # solo detras de nginx (activacion: administrador, via deploy).
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:3001:3001"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?debes definir DB_PASSWORD, no tiene valor por defecto}@postgres:5432/${DB_NAME:-uvg_collab}?schema=public
      - DIRECT_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?debes definir DB_PASSWORD, no tiene valor por defecto}@postgres:5432/${DB_NAME:-uvg_collab}?schema=public
      - PORT=3001
      # G01 (OWASP25-C019): sin valor por defecto; el backend exige >=32 caracteres.
      - JWT_SECRET=${JWT_SECRET:?debes definir JWT_SECRET, no tiene valor por defecto}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?debes definir JWT_REFRESH_SECRET, no tiene valor por defecto}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uvg-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/asanabria-2021067/proyecto-ingenieria-software-frontend:latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: uvg-collab-frontend
    profiles:
      - app
    restart: unless-stopped
    # G04 (OWASP25-C021 + P5/T19): igual que el backend.
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_URL_INTERNAL=http://backend:3001
    depends_on:
      - backend
    networks:
      - uvg-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
