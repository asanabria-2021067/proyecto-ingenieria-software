include:
  - path: apps/backend/docker-compose.yml
    env_file: .env

services:
  redis:
    image: redis:7-alpine
    container_name: uvg-collab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - uvg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/asanabria-2021067/proyecto-ingenieria-software-backend:latest}
    pull_policy: always
    container_name: uvg-collab-backend
    profiles:
      - app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-uvg_collab}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uvg-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/asanabria-2021067/proyecto-ingenieria-software-frontend:latest}
    pull_policy: always
    container_name: uvg-collab-frontend
    profiles:
      - app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_URL_INTERNAL=http://backend:3001
    depends_on:
      - backend
    networks:
      - uvg-network

volumes:
  redis-data:
