# ============================================================
# nginx.conf — UVG Collab (Azure VM)
# Frontend: Next.js en :3000
# Backend:  NestJS  en :3001
# ============================================================

# Número de workers = número de CPUs del servidor
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- Logging -----------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Seguridad básica --------------------------------------
    server_tokens off;                  # No exponer versión de Nginx
    client_max_body_size 10m;           # Límite de cuerpo de petición
    keepalive_timeout 65;

    # --- Gzip --------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # --- Rate limiting (protección básica contra abuso) --------
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=60r/s;

    # ===========================================================
    # Servidor principal en el puerto 80
    # IP pública de Azure: 158.23.57.118
    # Reemplaza con tu dominio cuando tengas TLS configurado
    # ===========================================================
    server {
        listen 80;
        server_name 158.23.57.118 _;   # Acepta IP directa o dominio

        # Cabeceras de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------
        # API Backend → NestJS en :3001
        # Todas las peticiones a /api/* se reenvían al backend
        # -------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://localhost:3001;
            proxy_http_version 1.1;

            # Cabeceras necesarias para NestJS / JWT / CORS
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # -------------------------------------------------------
        # Frontend → Next.js en :3000
        # El resto de rutas se reenvían al servidor Next.js
        # -------------------------------------------------------
        location / {
            limit_req zone=frontend burst=40 nodelay;

            proxy_pass         http://localhost:3000;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # WebSocket support (Next.js HMR en dev, no necesario en prod)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # -------------------------------------------------------
        # Archivos estáticos de Next.js (_next/static)
        # Cache agresivo porque Next.js usa hashes en los nombres
        # -------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://localhost:3000;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Página de error personalizada
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ===========================================================
    # OPCIONAL: Bloque para TLS (descomenta cuando tengas certificado)
    # Usa Certbot: sudo certbot --nginx -d tudominio.com
    # ===========================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name tudominio.com www.tudominio.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ...mismo bloque location que el server de arriba...
    # }
    #
    # Redirección HTTP → HTTPS
    # server {
    #     listen 80;
    #     server_name tudominio.com www.tudominio.com;
    #     return 301 https://$host$request_uri;
    # }
}
